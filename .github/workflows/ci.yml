name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  compile-and-lit:
    name: Compile and lit
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LLVM_CACHE_VERSION: v1
      VENV_DIR: ${{ github.workspace }}/.venv

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Create build environment
        run: |
          python -m venv "${VENV_DIR}"
          "${VENV_DIR}/bin/python" -m pip install \
            --requirement build_tools/requirements.txt
          echo "${VENV_DIR}/bin" >> "${GITHUB_PATH}"
          "${VENV_DIR}/bin/cmake" --version
          "${VENV_DIR}/bin/ninja" --version

      - name: Restore LLVM
        id: llvm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/llvm-install
            build/_deps/llvm-project/llvm/lib/Target/AMDGPU
            build/_deps/llvm-project/llvm/utils/lit
            build/llvm-build/bin/llvm-lit
            build/llvm-build/lib/Target/AMDGPU
          key: >-
            ${{ runner.os }}-python312-llvm-${{ env.LLVM_CACHE_VERSION }}-${{
            hashFiles('llvm-commit.txt', 'build_tools/build_llvm.py',
            'build_tools/requirements.txt') }}

      - name: Build LLVM
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          python build_tools/build_llvm.py \
            --python-bindings \
            --no-rocm-runner \
            --no-refresh-wave-build \
            --jobs "$(nproc)"

      - name: Verify LLVM tree
        run: |
          test "$(cat build/llvm-install/.wave-mlir-commit)" = "$(cat llvm-commit.txt)"
          test -f build/_deps/llvm-project/llvm/lib/Target/AMDGPU/Utils/AMDGPUBaseInfo.h
          test -f build/_deps/llvm-project/llvm/utils/lit/lit/main.py
          test -x build/llvm-build/bin/llvm-lit
          test -f build/llvm-build/lib/Target/AMDGPU/AMDGPUGenInstrInfo.inc

      - name: Configure Wave
        run: |
          nanobind_dir="$("${VENV_DIR}/bin/python" -m nanobind --cmake_dir)"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython3_EXECUTABLE="${VENV_DIR}/bin/python" \
            -DPython_EXECUTABLE="${VENV_DIR}/bin/python" \
            -Dnanobind_DIR="${nanobind_dir}"

      - name: Compile Wave
        run: cmake --build build --parallel "$(nproc)"

      - name: Check generated scheduler tables
        run: python build_tools/gen_sched_table.py --check

      - name: Run compile-only lit tests
        run: |
          cmake --build build \
            --target check-wave-mlir-compile-only \
            --parallel "$(nproc)"
