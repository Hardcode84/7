default_language_version:
  python: python3.12

# Vendored upstream code is shipped verbatim; project-level formatting,
# complexity, and ASCII-only rules don't apply to it.
exclude: '^third_party/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: '^(test/PerfGolden/Inputs/a4w4_mxfp_k16k_[123]\.mlir|docs/PerfReferences/hipblaslt-gfx950-f16-8192-tn-heuristic\.s)$'
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.3
    hooks:
      - id: clang-format
        types_or: [c, c++]

  - repo: https://github.com/Hardcode84/3
    rev: b9e06135de091a05e60831c40b3b1edb8cf39088
    hooks:
      - id: sort-cmake-lists

  - repo: https://github.com/Hardcode84/6
    rev: 030626f25acb8a963c0ecd49a66684e860c4e14a
    hooks:
      - id: tgenfmt
        name: Run tgenfmt on TableGen files

  - repo: https://github.com/psf/black
    rev: 26.3.1
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.1
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        additional_dependencies: [numpy]
        pass_filenames: false

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse

  - repo: local
    hooks:
      - id: lizard
        name: lizard
        entry: lizard
        language: python
        additional_dependencies: [lizard==1.21.6]
        types_or: [python, c, c++]
        args: [-l, python, -l, cpp, -C, "10", -L, "100", -W, whitelizard.txt]

      - id: check-ascii-only
        name: check ASCII-only (py / c / c++)
        entry: python build_tools/check_ascii_only.py
        language: python
        types_or: [python, c, c++]

      - id: check-verifier-coverage
        name: check verifier-coverage gaps
        entry: python build_tools/check_verifier_coverage.py
        language: python
        # Scans the whole tree, no per-file dispatch.
        pass_filenames: false
        # Triggers on any change to verifier sources or tests that
        # could open or close a gap.
        files: '^(lib/.+\.cpp|test/.+\.mlir|build_tools/check_verifier_coverage\.py)$'

      - id: check-ixsimpl-boundary
        name: check ixsimpl C API boundary
        entry: python build_tools/check_ixsimpl_boundary.py
        language: python
        pass_filenames: false
        files: '^(include/.+\.(h|td)|lib/.+\.(cpp|h|td)|python/.+\.(cpp|h)|tools/.+\.(cpp|h)|build_tools/check_ixsimpl_boundary\.py|\.pre-commit-config\.yaml)$'

      - id: gen-sched-table
        name: check generated scheduler tables vs LLVM schedule data
        entry: python build_tools/gen_sched_table.py --check
        language: python
        # Reads LLVM sources and queries build/bin/wave-target-info.
        pass_filenames: false
        files: '^(lib/Dialect/WaveAMDMachine/(CostModel/(LatencyTable\.cpp|LatencyTable\.inc|FunctionalUnit\.cpp|FunctionalUnitTable\.inc)|IR/WaveAMDMachineTarget\.cpp)|include/mlir/Dialect/WaveAMDMachine/(CMakeLists\.txt|CostModel/(CMakeLists\.txt|CostModelEnums\.(h|td)|FunctionalUnit\.h|LatencyTable\.h|SchedClass\.h)|IR/WaveAMDMachineTarget\.h)|tools/wave-target-info/(CMakeLists\.txt|wave-target-info\.cpp)|build_tools/gen_sched_table\.py)$'
