[project]
name = "wave-mlir"
version = "0.0.1"
description = "Standalone MLIR Wave dialect: explicit wave-level programming for AMDGPU."
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "black",
    "lizard",
    "mypy",
    "pre-commit",
    "pytest",
    "reuse",
    "ruff",
]

[tool.black]
target-version = ["py312"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "PIE", "PTH", "RET", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
# lit injects `config` and `lit_config` into the module namespace before
# evaluating the file; they aren't importable names.
"test/lit.cfg.py" = ["F821"]
# FileCheck CHECK patterns embed long MLIR type strings that ruff's 88-col
# wrap target cannot meaningfully break without changing semantics.
"test/python/dialects/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["python", "examples"]
# Re-export stubs for the auto-generated dialect ops live in the build
# tree; mypy can't resolve their `_*_ops_gen` siblings from the source
# tree, so skip them.
exclude = '(^|/)mlir/dialects/(wave|waveamd)\.py$'

# The MLIR core Python bindings ship without typed `.pyi` stubs; we still
# pick up the dialect classes we explicitly import.
[[tool.mypy.overrides]]
module = ["mlir.*"]
ignore_missing_imports = true

# ixsimpl ships a typed Python package but its install-time stubs live
# behind TYPE_CHECKING; the runtime API is fully usable without them.
[[tool.mypy.overrides]]
module = ["ixsimpl"]
ignore_missing_imports = true
