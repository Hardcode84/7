version = 1

# Source files carry an inline SPDX-License-Identifier (LLVM style); we
# aggregate a project-level copyright onto them.
[[annotations]]
path = ["**/*.cpp", "**/*.h"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 wave-mlir contributors"

[[annotations]]
path = ["wavec/**/*.cpp", "wavec/**/*.h"]
precedence = "override"
SPDX-FileCopyrightText = "2026 wave-mlir contributors"
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception"

# File types where the upstream LLVM convention is to omit any SPDX header
# (tests, examples, docs, CMakeLists, TableGen, some Python). We assert
# project license and copyright via REUSE.toml.
[[annotations]]
path = [
    "**/*.c",
    "**/*.td",
    "**/*.cmake",
    "**/*.checks",
    "**/*.py",
    "**/*.mlir",
    "**/*.s",
    "**/*.rst",
    "**/*.sh",
    "**/*.wave",
    "**/CMakeLists.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 wave-mlir contributors"
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception"

# Generic / metadata files.
[[annotations]]
path = [
    ".gitignore",
    ".gitmodules",
    ".pre-commit-config.yaml",
    "**/*.md",
    "**/*.toml",
    "**/*.json",
    "**/*.in",
    "LICENSE.TXT",
    "llvm-commit.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 wave-mlir contributors"
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception"
